name: Keep Chat Supabase Active Securely

on:
  schedule:
    # يعمل يومياً في منتصف النهار (الساعة 12:00 ظهراً بالتوقيت العالمي UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping-chat-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Real Query to Chat Supabase Database
        run: |
          curl -i -X GET "https://vmsvmvetlpszsmqigonp.supabase.co/rest/v1/users?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
